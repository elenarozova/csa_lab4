  Program
    Interrupt
      Program
    LetDecl(msg)
      String('hello world')
    LetDecl(i)
      Number(0)
    WhileStmt
      Compare(<)
        Variable(i)
        Number(11)
      Body:
        Program
          LetDecl(addr)
            BinOp(+)
              Number(0x3005)
              Variable(i)
          LetDecl(char)
            ReadByte
              Variable(addr)
          PrintByte
            Variable(char)
            Number(0x84)
          Assign(i)
            BinOp(+)
              Variable(i)
              Number(1)


