name: hello_Alice
description: "Проверка Alice"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
  }

  let msg = "What is your name? Hello, "
  let i = 0
  let char = 0
  let addr = 0x3007 + 1
  while (i < 26) {
      addr = addr+1
      char = read_byte(addr)
      print_byte(char, 0x84)
      i = i + 1
  }
  i = 0
  addr = 0x4000
  let len = read_byte(0x4000)
  while (i<len){
      addr = addr + 1
      let letter = read_byte(addr)
      print_byte(letter, 0x84)
      i = i+1
  }
  print_byte(33, 0x84)

ast: |
  Program
    Interrupt
      Program
        LetDecl(s)
          ReadByte
            Number(0x80)
        PrintByte
          Variable(s)
          BinOp(+)
            Number(0x4000)
            Variable(count)
        Assign(count)
          BinOp(+)
            Variable(count)
            Number(1)
    LetDecl(msg)
      String('What is your name? Hello, ')
    LetDecl(i)
      Number(0)
    LetDecl(char)
      Number(0)
    LetDecl(addr)
      BinOp(+)
        Number(0x3007)
        Number(1)
    WhileStmt
      Compare(<)
        Variable(i)
        Number(26)
      Body:
        Program
          Assign(addr)
            BinOp(+)
              Variable(addr)
              Number(1)
          Assign(char)
            ReadByte
              Variable(addr)
          PrintByte
            Variable(char)
            Number(0x84)
          Assign(i)
            BinOp(+)
              Variable(i)
              Number(1)
    Assign(i)
      Number(0)
    Assign(addr)
      Number(0x4000)
    LetDecl(len)
      ReadByte
        Number(0x4000)
    WhileStmt
      Compare(<)
        Variable(i)
        Variable(len)
      Body:
        Program
          Assign(addr)
            BinOp(+)
              Variable(addr)
              Number(1)
          LetDecl(letter)
            ReadByte
              Variable(addr)
          PrintByte
            Variable(letter)
            Number(0x84)
          Assign(i)
            BinOp(+)
              Variable(i)
              Number(1)
    PrintByte
      Number(33)
      Number(0x84)


