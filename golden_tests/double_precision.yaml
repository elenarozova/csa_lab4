name: double_precision
description: "Проверка 64 битной арифметики"
source_code: |
  interrupt {
  }
  let a_low = 0xFFFFFFFF
  let a_high = 0x00000001
  let b_low = 0xFFFFFFFF
  let b_high = 0x00000000
  let r_low =  a_low + b_low
  let r_high = adc(a_high, b_high)
  print_word(r_low, 0x84)
  print_word(r_high, 0x84)

ast: |
  Program
    Interrupt
      Program
    LetDecl(a_low)
      Number(0xFFFFFFFF)
    LetDecl(a_high)
      Number(0x00000001)
    LetDecl(b_low)
      Number(0xFFFFFFFF)
    LetDecl(b_high)
      Number(0x00000000)
    LetDecl(r_low)
      BinOp(+)
        Variable(a_low)
        Variable(b_low)
    LetDecl(r_high)
      Variable(adc(a_high, b_high))
    PrintWord
      Variable(r_low)
      Number(0x84)
    PrintWord
      Variable(r_high)
      Number(0x84)


