name: is_prime_17
description: "Проверка простого числа 17"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
    }
    let digit = read_byte(0x4000)
    if (digit<1){
        print_byte(-1, 0x84)
    }
    else {
        if (digit == 1){
            print_byte(0, 0x84)
        }
        else {
            let flag = 0
            let i = 2
            while(i*i<= digit){
                if(digit%i == 0){
                    flag = 1
                    break
                }
                i = i + 1
            }
            if (flag == 1){
                print_byte(0, 0x84)
            }
            else {
                print_byte(1, 0x84)
            }
        }
    }

input_schedule: 
  - [10, 17]
output_codes: [1]
cycles_total: 1429
cache_hits: 426
cache_misses: 95
log_fragment: |
  [Такт 10] - прерывание (trap)
  Сохраняем PC=0x0101 в EPC
  Записываем значение 17 в R_INT
  [Такт 1416] ВЫВОД: символ (ASCII 1)
  [Такт 1429] EXECUTE: halt - остановка процессора