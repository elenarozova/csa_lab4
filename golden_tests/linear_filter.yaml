name: linear_filter
description: "Проверка cache"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count + 1
  }
  let len = read_byte(0x4000)
  let arr_start = 0x4001
  let window_size = 4
  let i = 0
  while (i + window_size <= len) {
      let sum = 0
      let j = 0
      while (j < window_size) {
          let idx = arr_start + i 
          idx = idx + j     
          let val = read_byte(idx)
          sum = sum + val
          j = j + 1
      }
      print_byte(sum, 0x84)
      i = i + 1
  }

ast: |
  Program
    Interrupt
      Program
        LetDecl(s)
          ReadByte
            Number(0x80)
        PrintByte
          Variable(s)
          BinOp(+)
            Number(0x4000)
            Variable(count)
        Assign(count)
          BinOp(+)
            Variable(count)
            Number(1)
    LetDecl(len)
      ReadByte
        Number(0x4000)
    LetDecl(arr_start)
      Number(0x4001)
    LetDecl(window_size)
      Number(4)
    LetDecl(i)
      Number(0)
    WhileStmt
      Compare(<=)
        BinOp(+)
          Variable(i)
          Variable(window_size)
        Variable(len)
      Body:
        Program
          LetDecl(sum)
            Number(0)
          LetDecl(j)
            Number(0)
          WhileStmt
            Compare(<)
              Variable(j)
              Variable(window_size)
            Body:
              Program
                LetDecl(idx)
                  BinOp(+)
                    Variable(arr_start)
                    Variable(i)
                Assign(idx)
                  BinOp(+)
                    Variable(idx)
                    Variable(j)
                LetDecl(val)
                  ReadByte
                    Variable(idx)
                Assign(sum)
                  BinOp(+)
                    Variable(sum)
                    Variable(val)
                Assign(j)
                  BinOp(+)
                    Variable(j)
                    Number(1)
          PrintByte
            Variable(sum)
            Number(0x84)
          Assign(i)
            BinOp(+)
              Variable(i)
              Number(1)


