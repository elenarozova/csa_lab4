name: is_prime_1
description: "Проверка числа 1"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
    }
    let digit = read_byte(0x4000)
    if (digit<1){
        print_byte(-1, 0x84)
    }
    else {
        if (digit == 1){
            print_byte(0, 0x84)
        }
        else {
            let flag = 0
            let i = 2
            while(i*i<= digit){
                if(digit%i == 0){
                    flag = 1
                    break
                }
                i = i + 1
            }
            if (flag == 1){
                print_byte(0, 0x84)
            }
            else {
                print_byte(1, 0x84)
            }
        }
    }

input_schedule: 
  - [10, 1]
output_codes: [0]
cycles_total: 628
cache_hits: 135
cache_misses: 46
log_fragment: |
  [Такт 10] - прерывание (trap)
  Сохраняем PC=0x0101 в EPC
  Записываем значение 1 в R_INT
  [Такт 603] ВЫВОД: символ (ASCII 0)
  [Такт 628] EXECUTE: halt - остановка процессора