name: is_prime_1
description: "Проверка числа 1"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
    }
    let digit = read_byte(0x4000)
    if (digit<1){
        print_byte(-1, 0x84)
    }
    else {
        if (digit == 1){
            print_byte(0, 0x84)
        }
        else {
            let flag = 0
            let i = 2
            while(i*i<= digit){
                if(digit%i == 0){
                    flag = 1
                    break
                }
                i = i + 1
            }
            if (flag == 1){
                print_byte(0, 0x84)
            }
            else {
                print_byte(1, 0x84)
            }
        }
    }

ast: |
    Program
        Interrupt
            Program
            LetDecl(s)
                ReadByte
                Number(0x80)
            PrintByte
                Variable(s)
                BinOp(+)
                Number(0x4000)
                Variable(count)
            Assign(count)
                BinOp(+)
                Variable(count)
                Number(1)
        LetDecl(digit)
            ReadByte
            Number(0x4000)
        IfStmt
            Compare(<)
            Variable(digit)
            Number(1)
            Body:
            Program
                PrintByte
                Number(-1)
                Number(0x84)
            ElseBody:
            Program
                IfStmt
                Compare(==)
                    Variable(digit)
                    Number(1)
                Body:
                    Program
                    PrintByte
                        Number(0)
                        Number(0x84)
                ElseBody:
                    Program
                    LetDecl(flag)
                        Number(0)
                    LetDecl(i)
                        Number(2)
                    WhileStmt
                        Compare(<=)
                        BinOp(*)
                            Variable(i)
                            Variable(i)
                        Variable(digit)
                        Body:
                        Program
                            IfStmt
                            Compare(==)
                                BinOp(%)
                                Variable(digit)
                                Variable(i)
                                Number(0)
                            Body:
                                Program
                                Assign(flag)
                                    Number(1)
                                Break
                            Assign(i)
                            BinOp(+)
                                Variable(i)
                                Number(1)
                    IfStmt
                        Compare(==)
                        Variable(flag)
                        Number(1)
                        Body:
                        Program
                            PrintByte
                            Number(0)
                            Number(0x84)
                        ElseBody:
                        Program
                            PrintByte
                            Number(1)
                            Number(0x84)

