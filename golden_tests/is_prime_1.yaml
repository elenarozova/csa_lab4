            PrintByte
                Variable(s)
                BinOp(+)
                Number(0x4000)
                Variable(count)
            Assign(count)
                BinOp(+)
                Variable(count)
                Number(1)
        LetDecl(digit)
            ReadByte
            Number(0x4000)
        IfStmt
            Compare(<)
            Variable(digit)
            Number(1)
            Body:
            Program
                PrintByte
                Number(-1)
                Number(0x84)
            ElseBody:
            Program
                IfStmt
                Compare(==)
                    Variable(digit)
                    Number(1)
                Body:
                    Program
                    PrintByte
                        Number(0)
                        Number(0x84)
                ElseBody:
                    Program
                    LetDecl(flag)
                        Number(0)
                    LetDecl(i)
                        Number(2)
                    WhileStmt
                        Compare(<=)
                        BinOp(*)
                            Variable(i)
                            Variable(i)
                        Variable(digit)
                        Body:
                        Program
                            IfStmt
                            Compare(==)
                                BinOp(%)
                                Variable(digit)
                                Variable(i)
                                Number(0)
                            Body:
                                Program
                                Assign(flag)
                                    Number(1)
                                Break
                            Assign(i)
                            BinOp(+)
                                Variable(i)
                                Number(1)
                    IfStmt
                        Compare(==)
                        Variable(flag)
                        Number(1)
                        Body:
                        Program
                            PrintByte
                            Number(0)
                            Number(0x84)
                        ElseBody:
                        Program
                            PrintByte
                            Number(1)
                            Number(0x84)

