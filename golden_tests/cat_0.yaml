name: cat_0
description: "Проверка 0"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
  }
  let len = read_byte(0x4000)
  let i = 0
  let addr = 0x4000
  while (i<len){
      addr = addr + 1
      let letter = read_byte(addr)
      print_byte(letter, 0x84)
      i = i+1
  }

input_schedule: 
  - [10, 0]
output_codes: []
cycles_total: 613
cache_hits: 126
cache_misses: 45
log_fragment: |
  [Такт 10] - прерывание (trap)
  Сохраняем PC=0x0101 в EPC
  Записываем значение 0 в R_INT
  [Такт 613] EXECUTE: halt - остановка процессора