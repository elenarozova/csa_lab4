name: cat_hi
description: "Проверка hi"
source_code: |
  interrupt {
    let s = read_byte(0x80)
    print_byte(s, 0x4000 + count)
    count = count+1
  }
  let len = read_byte(0x4000)
  let i = 0
  let addr = 0x4000
  while (i<len){
      addr = addr + 1
      let letter = read_byte(addr)
      print_byte(letter, 0x84)
      i = i+1
  }

ast: |
  Program
    Interrupt
      Program
        LetDecl(s)
          ReadByte
            Number(0x80)
        PrintByte
          Variable(s)
          BinOp(+)
            Number(0x4000)
            Variable(count)
        Assign(count)
          BinOp(+)
            Variable(count)
            Number(1)
    LetDecl(len)
      ReadByte
        Number(0x4000)
    LetDecl(i)
      Number(0)
    LetDecl(addr)
      Number(0x4000)
    WhileStmt
      Compare(<)
        Variable(i)
        Variable(len)
      Body:
        Program
          Assign(addr)
            BinOp(+)
              Variable(addr)
              Number(1)
          LetDecl(letter)
            ReadByte
              Variable(addr)
          PrintByte
            Variable(letter)
            Number(0x84)
          Assign(i)
            BinOp(+)
              Variable(i)
              Number(1)


