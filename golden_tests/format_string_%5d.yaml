    [state] R0=00000000, R1=00000000, R2=00000000, R3=00000000, R4=00000000, R5=00000000, R6=00000000, R7=00000000 | flags: z=0 n=0 c=0 v=0 | IE=1
    [Такт 10] - прерывание (trap)
    Сохраняем PC=0x0101 в EPC
    Записываем значение 78 в R_INT
